<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1040" viewBox="-20 0 1040 1040" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4b4f"/>
    </marker>
  </defs>

  <rect x="-20" width="1040" height="1040" fill="#ffffff"/>

  <!-- Start-up -->
  <rect x="180" y="30" width="520" height="100" rx="10" fill="#e8f2f1" stroke="#0d6b66" stroke-width="2"/>
  <text x="440" y="62" text-anchor="middle" font-size="19" font-weight="700" fill="#0d6b66">Start-up: once per corpus</text>
  <text x="440" y="88" text-anchor="middle" font-size="15" fill="#1b2427">Ingest every JSON file in CORPUS_DIR</text>
  <text x="440" y="112" text-anchor="middle" font-size="14" fill="#56666b">documents · fields · chunks · keyword index · vectors</text>

  <line x1="440" y1="130" x2="440" y2="168" stroke="#3d4b4f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="452" y="155" font-size="13" fill="#56666b">index ready, /health 200</text>

  <!-- Request -->
  <rect x="180" y="172" width="520" height="56" rx="10" fill="#ffffff" stroke="#56666b" stroke-width="2"/>
  <text x="440" y="207" text-anchor="middle" font-size="17" font-weight="600" fill="#1b2427">POST /ask   {"question": "…"}</text>

  <line x1="440" y1="228" x2="440" y2="266" stroke="#3d4b4f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Queue -->
  <rect x="180" y="270" width="520" height="56" rx="10" fill="#ffffff" stroke="#56666b" stroke-width="2"/>
  <text x="440" y="305" text-anchor="middle" font-size="16" fill="#1b2427">Queue: up to 4 answers at once · 150 s deadline</text>

  <line x1="440" y1="326" x2="440" y2="364" stroke="#3d4b4f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- First search -->
  <rect x="180" y="368" width="520" height="56" rx="10" fill="#fdf3e6" stroke="#9a5a12" stroke-width="2"/>
  <text x="440" y="403" text-anchor="middle" font-size="16" fill="#1b2427"><tspan font-weight="700">First search</tspan>: the question exactly as asked</text>

  <line x1="440" y1="424" x2="440" y2="462" stroke="#3d4b4f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Agent loop -->
  <rect x="180" y="466" width="520" height="250" rx="12" fill="#f3f7f7" stroke="#0d6b66" stroke-width="2.5"/>
  <text x="440" y="500" text-anchor="middle" font-size="19" font-weight="700" fill="#0d6b66">Agent loop</text>
  <text x="440" y="524" text-anchor="middle" font-size="14" fill="#56666b">Gemini 3.8 Flash · thinking HIGH · up to 10 steps</text>
  <text x="440" y="556" text-anchor="middle" font-size="14" fill="#1b2427">each step, the model calls up to 4 tools:</text>

  <g font-size="14" font-family="'SF Mono', Menlo, Consolas, monospace" fill="#1b2427">
    <rect x="206" y="574" width="110" height="32" rx="6" fill="#ffffff" stroke="#9fb3b1"/>
    <text x="261" y="595" text-anchor="middle">search</text>
    <rect x="326" y="574" width="110" height="32" rx="6" fill="#ffffff" stroke="#9fb3b1"/>
    <text x="381" y="595" text-anchor="middle">filter</text>
    <rect x="446" y="574" width="120" height="32" rx="6" fill="#ffffff" stroke="#9fb3b1"/>
    <text x="506" y="595" text-anchor="middle">field_values</text>
    <rect x="576" y="574" width="104" height="32" rx="6" fill="#ffffff" stroke="#9fb3b1"/>
    <text x="628" y="595" text-anchor="middle">read_fields</text>

    <rect x="236" y="616" width="130" height="32" rx="6" fill="#ffffff" stroke="#9fb3b1"/>
    <text x="301" y="637" text-anchor="middle">read_document</text>
    <rect x="376" y="616" width="120" height="32" rx="6" fill="#ffffff" stroke="#9fb3b1"/>
    <text x="436" y="637" text-anchor="middle">lookup_key</text>
    <rect x="506" y="616" width="120" height="32" rx="6" fill="#ffffff" stroke="#9fb3b1"/>
    <text x="566" y="637" text-anchor="middle">list_fields</text>
  </g>

  <text x="440" y="682" text-anchor="middle" font-size="13" fill="#56666b">sees "Step N of 10" · stops when every part is answered or missing</text>
  <text x="440" y="702" text-anchor="middle" font-size="13" fill="#56666b">only finish is allowed at a limit or with 30 s left</text>

  <!-- next-step loop on the left of the agent box -->
  <path d="M180,660 C120,660 120,530 176,530" fill="none" stroke="#0d6b66" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="96" y="600" font-size="13" fill="#0d6b66" text-anchor="middle">next</text>
  <text x="96" y="616" font-size="13" fill="#0d6b66" text-anchor="middle">step</text>

  <!-- Index on the right -->
  <rect x="750" y="500" width="220" height="180" rx="10" fill="#e8f2f1" stroke="#0d6b66" stroke-width="2"/>
  <text x="860" y="532" text-anchor="middle" font-size="17" font-weight="700" fill="#0d6b66">The index</text>
  <text x="860" y="562" text-anchor="middle" font-size="14" fill="#1b2427">documents and fields</text>
  <text x="860" y="588" text-anchor="middle" font-size="14" fill="#1b2427">field profile, keys, links</text>
  <text x="860" y="614" text-anchor="middle" font-size="14" fill="#1b2427">keyword index (BM25)</text>
  <text x="860" y="640" text-anchor="middle" font-size="14" fill="#1b2427">vectors, in memory</text>
  <text x="860" y="664" text-anchor="middle" font-size="12" fill="#56666b">one SQLite file</text>

  <!-- tools <-> index -->
  <line x1="704" y1="610" x2="746" y2="610" stroke="#3d4b4f" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- start-up builds the index -->
  <path d="M700,80 L860,80 L860,496" fill="none" stroke="#0d6b66" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="872" y="300" font-size="13" fill="#0d6b66">builds</text>

  <line x1="440" y1="716" x2="440" y2="786" stroke="#3d4b4f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="452" y="756" font-size="13" fill="#56666b">finish(answer, citations, parts not found)</text>

  <!-- Citations -->
  <rect x="180" y="790" width="520" height="56" rx="10" fill="#ffffff" stroke="#56666b" stroke-width="2"/>
  <text x="440" y="825" text-anchor="middle" font-size="16" fill="#1b2427"><tspan font-weight="700">Citations</tspan> → document ids (known ids only, no repeats)</text>

  <line x1="440" y1="846" x2="440" y2="884" stroke="#3d4b4f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Response -->
  <rect x="180" y="888" width="520" height="56" rx="10" fill="#e2f0ee" stroke="#0d6b66" stroke-width="2"/>
  <text x="440" y="923" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2427">HTTP 200   {"answer": "…", "document_ids": ["dsid_…"]}</text>

  <text x="500" y="985" text-anchor="middle" font-size="14" fill="#56666b">Every step is traced in Langfuse: one trace per question, its id in the X-Trace-Id header.</text>
</svg>
